name: test-formula

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  formula:
    name: formula (${{ matrix.formula }}, ${{ matrix.arch }} on ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            formula: env-vault
          - runner: macos-15-intel
            arch: x86_64
            formula: env-vault
          - runner: macos-15
            arch: arm64
            formula: macos-user-settings
          - runner: macos-15-intel
            arch: x86_64
            formula: macos-user-settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tap this checkout
        run: brew tap ildarbinanas-design/tap "$GITHUB_WORKSPACE"

      # Homebrew 6 ignores formulae from untrusted third-party taps, so
      # `brew audit` of this checkout fails before it is installed. Trust only
      # the formula under test, not the whole tap.
      - name: Trust the formula under test
        run: brew trust --formula "ildarbinanas-design/tap/${{ matrix.formula }}"

      - name: brew style
        run: brew style ildarbinanas-design/tap

      # Both formulae are generated by release tooling that requires one
      # explicit `version` line (env-vault's publish-homebrew-pr.sh parses it
      # and compares the formula byte for byte). Homebrew reports that line as
      # redundant with the release URL; skip only that resource `version`
      # audit and keep every other strict check.
      - name: brew audit
        run: brew audit --strict --except=version "ildarbinanas-design/tap/${{ matrix.formula }}"

      - name: brew install
        run: brew install "ildarbinanas-design/tap/${{ matrix.formula }}"

      - name: brew test
        run: brew test "ildarbinanas-design/tap/${{ matrix.formula }}"

  # A formula may point only at its own project's release assets for its
  # version, with the checksums that release published. Installing and running
  # --version cannot tell a genuine asset from a substituted one.
  pins:
    name: pins (${{ matrix.formula }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        formula: [env-vault, macos-user-settings]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Match every url and sha256 to the published release checksums
        env:
          FORMULA: ${{ matrix.formula }}
        run: |
          set -euo pipefail
          file="Formula/${FORMULA}.rb"
          version="$(sed -nE 's/^  version "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' "$file")"
          test -n "$version"
          prefix="https://github.com/ildarbinanas-design/${FORMULA}/releases/download/v${version}/${FORMULA}-"
          urls="$(grep -cE '^ *url "' "$file")"
          checked=0
          while read -r url sum; do
            case "$url" in
              "$prefix"*) ;;
              *) echo "::error::${url} is not a ${FORMULA} v${version} release asset"; exit 1 ;;
            esac
            published="$(curl -fsSL --retry 3 "${url}.sha256" | awk 'NR == 1 { print $1 }')"
            if [ "$published" != "$sum" ]; then
              echo "::error::sha256 for ${url} differs from the published ${url}.sha256"
              exit 1
            fi
            checked=$((checked + 1))
          done < <(awk '
            /^ *url "/ { u = $0; sub(/^ *url "/, "", u); sub(/".*/, "", u); next }
            /^ *sha256 "/ { s = $0; sub(/^ *sha256 "/, "", s); sub(/".*/, "", s); print u, s; u = "" }
          ' "$file")
          test "$checked" -gt 0
          test "$checked" -eq "$urls"
          echo "${FORMULA} v${version}: ${checked} url/sha256 pairs match the published checksums"

  # Keep this exact check name: the active main ruleset requires `test`.
  test:
    name: test
    if: ${{ always() }}
    needs: [formula, pins]
    runs-on: ubuntu-latest
    steps:
      - name: Require every formula matrix job
        env:
          FORMULA_RESULT: ${{ needs.formula.result }}
          PINS_RESULT: ${{ needs.pins.result }}
        run: test "$FORMULA_RESULT" = "success" && test "$PINS_RESULT" = "success"
